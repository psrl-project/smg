# Use a recent grpcio-tools so generated stubs match the protobuf 7 runtime
# (smg-grpc-servicer pulls grpcio-reflection/health 1.82+/1.83, which need
# protobuf>=7.35.1). Restored from the pre-1.78.0 pin on psrl-dev; the old
# ==1.78.0 / protobuf-6 pin is no longer needed once the stack is on protobuf 7.
[build-system]
requires = ["setuptools>=77.0", "grpcio-tools>=1.81.1"]
build-backend = "setuptools.build_meta"

[project]
name = "smg-grpc-proto"
version = "0.4.14"
description = "SMG gRPC proto definitions for vLLM, TRT-LLM, MLX, TokenSpeed, and SGLang"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.81.1",
    "protobuf>=7.35.1,<8",
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Chang Su", email = "mckvtl@gmail.com"},
    {name = "Simo Lin", email = "linsimo.mark@gmail.com"},
    {name = "Keyang Ru", email = "rukeyang@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/lightseekorg/smg"
Repository = "https://github.com/lightseekorg/smg"

[tool.setuptools.packages.find]
where = ["."]
include = ["smg_grpc_proto*"]

[tool.setuptools.package-data]
smg_grpc_proto = ["proto/*.proto", "generated/*.py", "generated/*.pyi"]
